    <style>
      a {
        border: 2px solid #FF5733; /* sets thickness, style, and color */
        padding: 5px 10px;        /* adds space inside the box */
        text-decoration: none;    /* optional: removes the default underline */
        color: #FF5733;           /* optional: matches text color to the box */
      }
      .a {
        position: absolute;
        top: 50%;
        left: 50%;
        /* Centers the element first (-50%), then shifts it 40px to the right (+40px) */
        transform: translate(calc(-50% + 40px), -50%);
      }
    </style>
  </head>
